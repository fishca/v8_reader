name: Build C++Builder Project (Self-hosted)

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    # Êëþ÷åâîé ìîìåíò: óêàçûâàåì ìåòêè âàøåãî runner
    runs-on: [Windows, x64, Self-hosted]

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Build Project (Release)
      shell: cmd
      run: |
        echo "Building the project..."
        cd /d "S:/work/CPP/BDS13/v8reader"
        call "C:/Program Files (x86)/Embarcadero/Studio/37.0/bin/rsvars.bat"        
        msbuild "S:/work/CPP/BDS13/v8reader/v8reader.cbproj" /p:Configuration=Release /p:Platform=Win32 /v:normal
        
        echo "Build finished."

    - name: Upload Build Artifact
      uses: actions/upload-artifact@v4
      with:
        name: v8reader
        path: S:/work/CPP/BDS13/v8reader/Release/v8reader.exe
        # Îáû÷íî áèíàðíèê ñîçäàåòñÿ â ïîäïàïêå Win32/Release
